name: Build ArfanMusic APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Baca versi Flutter dari pubspec.yaml
        run: |
          V=$(grep -E '^  flutter: \^' pubspec.yaml | sed 's/.*\^//' | tr -d ' \r')
          echo "FLUTTER_VERSION=$V" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - run: flutter build apk --release --flavor github

      - uses: actions/upload-artifact@v4
        with:
          name: ArfanMusic-apk
          path: build/app/outputs/flutter-apk/app-github-release.apk
          retention-days: 30
